<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Словарные слова</title>
<meta name="theme-color" content="#ff7a3d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Словарик">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg1: #fff1dc; --bg2: #dff3ff;
    --ink: #2d2350; --muted: #6b6390;
    --card: #ffffff; --accent: #ff7a3d;
    --good: #22b14c; --bad: #ef4444;
    --c: #ff7a3d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    background-attachment: fixed;
    touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  .screen { display: none; min-height: 100dvh; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; flex-direction: column; }
  .screen.on { display: flex; }

  /* Главный экран */
  h1 { text-align: center; font-size: clamp(30px, 9vw, 44px); margin: 8px 0 4px; }
  .sub { text-align: center; color: var(--muted); font-size: 17px; margin: 0 0 14px; }
  .label { font-weight: 800; font-size: 20px; margin: 14px 4px 10px; }
  .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .tab { background: var(--card); border-radius: 18px; padding: 10px 4px; font-weight: 800; font-size: 15px; box-shadow: 0 4px 0 #0001; border: 4px solid transparent; line-height: 1.1; }
  .tab b { display: block; font-size: 28px; color: var(--accent); }
  .tab.sel { border-color: var(--accent); background: #fff3ea; }
  .tab.soon { opacity: .75; }
  .soonbox { background: var(--card); border-radius: 24px; padding: 28px 18px; text-align: center; font-size: 20px; font-weight: 700; margin-top: 16px; box-shadow: 0 5px 0 #0001; }
  .soonbox b { display: block; font-size: 56px; margin-bottom: 8px; }
  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modes.two { grid-template-columns: 1fr 1fr; }
  .mode { background: var(--card); border-radius: 20px; padding: 12px 6px; font-size: 17px; font-weight: 800; box-shadow: 0 5px 0 #0001; border: 4px solid transparent; line-height: 1.2; }
  .mode b { display: block; font-size: 30px; margin-bottom: 2px; }
  .mode small { font-weight: 700; color: var(--muted); }
  .mode.sel { border-color: var(--accent); background: #fff3ea; }
  .rec { display: inline-block; margin-top: 4px; font-size: 13px; background: #ffe066; border-radius: 10px; padding: 1px 7px; }
  .big { width: 100%; padding: 18px; border-radius: 22px; font-size: 24px; font-weight: 900; background: var(--c); color: #fff; box-shadow: 0 6px 0 #0000002a; margin-top: 14px; }
  .big.light { background: var(--card); color: var(--ink); }
  .bottom { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .pill { background: var(--card); border-radius: 999px; padding: 12px 18px; font-size: 17px; font-weight: 800; box-shadow: 0 4px 0 #0001; }
  .pill.install { background: var(--accent); color: #fff; }
  .tab:active, .mode:active, .big:active, .opt:active, .pill:active { transform: translateY(4px); box-shadow: 0 2px 0 #0000002a; }

  /* Игра */
  .top { display: flex; align-items: center; gap: 10px; }
  .back { background: var(--card); width: 52px; height: 52px; border-radius: 16px; font-size: 26px; font-weight: 900; box-shadow: 0 4px 0 #0001; flex: none; }
  .bar { flex: 1; height: 22px; background: #ffffffaa; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--c); border-radius: 999px; transition: width .3s; }
  .count { font-size: 22px; font-weight: 900; min-width: 64px; text-align: right; }
  .score { text-align: center; font-size: 20px; font-weight: 800; color: var(--muted); margin: 10px 0 0; min-height: 28px; }
  .score b { color: var(--good); }
  .score .x { color: var(--bad); }
  .card {
    flex: 1; margin: 12px 0; background: var(--card); border-radius: 30px; border: 6px solid var(--c);
    display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative;
    box-shadow: 0 8px 0 #0000001a; min-height: 220px; padding: 14px 8px; transition: background .2s, border-color .2s;
  }
  .pic { font-size: 84px; line-height: 1; margin-bottom: 14px; }
  .word { font-size: clamp(36px, 11vw, 60px); font-weight: 900; letter-spacing: 2px; text-align: center; line-height: 1.35; word-break: keep-all; }
  .word.long { font-size: clamp(29px, 8.6vw, 48px); letter-spacing: 1px; }
  .gap { display: inline-block; min-width: 1.1em; border-bottom: 6px solid #d6d0ee; color: #d6d0ee; text-align: center; margin: 0 2px; }
  .gap.cur { border-color: var(--c); color: var(--c); animation: blink 1s infinite; }
  .gap.ok { border-color: var(--good); color: var(--good); animation: none; }
  .gap.no { border-color: var(--bad); color: var(--bad); animation: none; }
  @keyframes blink { 50% { opacity: .35; } }
  .card.ok { background: #e3f9e7; border-color: var(--good); }
  .card.no { background: #fde8e8; border-color: var(--bad); animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-12px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(8px)} }
  .pop { position: absolute; top: 8px; font-size: 50px; animation: pop .8s ease-out forwards; pointer-events: none; }
  @keyframes pop { from { transform: scale(.3) translateY(20px); opacity: 0 } 40% { opacity: 1; transform: scale(1.2) } to { transform: scale(1) translateY(-30px); opacity: 0 } }
  .opts { display: flex; gap: 12px; justify-content: center; }
  .opt {
    flex: 1; max-width: 170px; height: clamp(76px, 13dvh, 110px); border-radius: 24px; background: var(--card);
    font-size: clamp(38px, 11vw, 54px); font-weight: 900; box-shadow: 0 6px 0 #0000001f;
  }

  /* Запоминалка после ошибки */
  .modal { position: fixed; inset: 0; background: #0007; display: none; align-items: flex-end; justify-content: center; padding: 16px; z-index: 9; }
  .modal.on { display: flex; }
  .sheet { background: #fff; border-radius: 28px; padding: 22px 20px; max-width: 520px; width: 100%; font-size: 19px; line-height: 1.45; animation: up .3s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0 } }
  .sheet h3 { margin: 0 0 10px; font-size: 24px; }
  .sheet ol { padding-left: 22px; margin: 8px 0 14px; }
  .memo { text-align: center; }
  .memo .art { position: relative; display: inline-block; margin: 4px 0 8px; }
  .memo .art .emo { font-size: 110px; line-height: 1; }
  .memo .art .lt {
    position: absolute; right: -34px; bottom: -6px; min-width: 76px; height: 76px; padding: 0 10px; border-radius: 38px;
    background: var(--good); color: #fff; font-size: 48px; font-weight: 900; line-height: 76px; box-shadow: 0 6px 0 #0002;
    animation: bounce .9s ease-in-out infinite alternate;
  }
  @keyframes bounce { to { transform: translateY(-8px) rotate(-6deg); } }
  .memo .right { font-size: 36px; font-weight: 900; letter-spacing: 1px; margin: 6px 0; }
  .memo .right em, .memo .tip em { font-style: normal; color: var(--good); font-size: 1.15em; }
  .memo .tip { font-size: 21px; font-weight: 700; background: #fff6d6; border-radius: 18px; padding: 12px 14px; margin: 10px 0 4px; }

  /* Итог */
  .res { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 8px; }
  .stars { font-size: 64px; letter-spacing: 6px; }
  .stars .off { filter: grayscale(1); opacity: .3; }
  .resnum { font-size: clamp(76px, 24vw, 120px); font-weight: 900; line-height: 1; color: var(--c); }
  .restxt { font-size: 24px; font-weight: 800; }
  .resmini { font-size: 18px; color: var(--muted); font-weight: 700; }
  .newrec { background: #ffe066; padding: 6px 16px; border-radius: 999px; font-weight: 900; font-size: 20px; }
  .mist { background: var(--card); border-radius: 20px; padding: 12px 16px; font-size: 20px; font-weight: 800; width: 100%; box-shadow: 0 4px 0 #0001; }
  .mist div { color: var(--muted); font-size: 16px; margin-bottom: 4px; }
  .mist em, .list em { font-style: normal; color: var(--accent); }
  .list { columns: 2; font-size: 19px; font-weight: 700; line-height: 1.6; margin: 8px 0 12px; max-height: 55dvh; overflow-y: auto; }
</style>
</head>
<body>

<!-- Главный экран -->
<section class="screen on" id="home">
  <h1>📖 Словарик</h1>
  <p class="sub">Словарные слова · «Школа России»</p>

  <div class="tabs" id="tabs"></div>
  <div id="classBox"></div>

  <div class="bottom">
    <button class="pill" id="soundBtn">🔊 Звук</button>
    <button class="pill install" id="installBtn">📲 Установить на телефон</button>
  </div>
</section>

<!-- Игра -->
<section class="screen" id="game">
  <div class="top">
    <button class="back" id="backBtn" aria-label="Назад">←</button>
    <div class="bar"><i id="barFill"></i></div>
    <div class="count" id="count"></div>
  </div>
  <div class="score" id="score"></div>
  <div class="card" id="card">
    <div class="pic" id="pic"></div>
    <div class="word" id="word"></div>
  </div>
  <div class="opts" id="opts"></div>
</section>

<!-- Итог -->
<section class="screen" id="result">
  <div class="res">
    <div class="stars" id="stars"></div>
    <div class="resnum" id="resNum"></div>
    <div class="restxt" id="resTxt"></div>
    <div class="resmini" id="resMini"></div>
    <div class="newrec" id="newRec" hidden>🏆 Новый рекорд!</div>
    <div class="mist" id="mist" hidden></div>
  </div>
  <button class="big" id="againBtn">🔁 Ещё раз</button>
  <button class="big light" id="homeBtn">🏠 На главную</button>
</section>

<!-- Окно: запоминалка, список слов, установка -->
<div class="modal" id="modal">
  <div class="sheet">
    <div id="modalText"></div>
    <button class="big" id="modalClose">Понятно</button>
  </div>
</div>

<script src="slova.js"></script>
<script>
const PRAISE = ['🎉','⭐','👍','💪','🌟','😎','🚀','🔥','🥳','👏'];
const ROUND = 10, TIME = 60;
const PART_NAME = ['1 часть', '2 часть', 'Все слова'];
const $ = id => document.getElementById(id);

const st = { klass: 3, part: 2, mode: 'calm', queue: [], cur: null, gap: 0, ok: 0, bad: 0, done: 0, firstTry: 0, missed: [], locked: false, endAt: 0, pausedLeft: 0, tick: null, last: '' };

// ---------- Сохранение (рекорды, звук, выбранный класс) ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let soundOn = store.get('sound', true);

// ---------- Разбор словаря ----------
// 'п[о]н[е]дельник' → части текста и трудные места с вариантами
const PAIRS = { 'о': 'а', 'а': 'о', 'е': 'и', 'и': 'е', 'я': 'е', 'ё': 'о', 'ы': 'и', 'э': 'е' };
function parse([raw, emoji, ...hints]) {
  const parts = [], gaps = [];
  raw.split(/(\[[^\]]+\])/).forEach(p => {
    if (!p) return;
    if (p[0] !== '[') { parts.push(p); return; }
    const opts = p.slice(1, -1).split('|');
    if (opts.length === 1) opts.push(PAIRS[opts[0]]);
    gaps.push({ right: opts[0], opts, hint: hints[Math.min(gaps.length, hints.length - 1)] });
    parts.push({ gap: gaps.length - 1 });
  });
  const text = parts.map(p => typeof p === 'string' ? p : gaps[p.gap].right).join('');
  return { raw, emoji, parts, gaps, text };
}
function wordsOf(klass, part) {
  const k = SLOVA[klass];
  if (!k) return [];
  const list = part === 2 ? k.chasti.flat() : k.chasti[part];
  return list.map(parse);
}
// Слово целиком, трудные места выделены
function marked(w) { return w.parts.map(p => typeof p === 'string' ? p : `<em>${w.gaps[p.gap].right}</em>`).join(''); }
// *буква* в подсказке → выделенная буква
function tip(s) { return s.replace(/\*([^*]+)\*/g, '<em>$1</em>'); }

// ---------- Звуки ----------
let ac = null;
function beep(freqs, dur = 0.12, type = 'triangle') {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f;
      g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur * 1.6);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur * 1.7);
    });
  } catch (e) {}
}
// Сигнал ошибки: низкое «бз-з-з», которое съезжает вниз
function buzz() {
  if (navigator.vibrate) try { navigator.vibrate([90, 60, 90]); } catch (e) {}
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(190, t); o.frequency.linearRampToValueAtTime(95, t + 0.45);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.16, t + 0.03);
    g.gain.setValueAtTime(0.16, t + 0.35); g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.52);
  } catch (e) {}
}

// ---------- Салют за правильный ответ ----------
const fx = document.createElement('canvas');
fx.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8';
document.body.appendChild(fx);
const ctx = fx.getContext('2d');
const FIRE = ['#ff5d5d','#ff9a1f','#ffd400','#2fbf5b','#14b8c9','#3d8bff','#a66bff','#ff4fb0'];
let sparks = [], fxRun = false;
function rnd(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
function firework() {
  const dpr = window.devicePixelRatio || 1;
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const r = $('card').getBoundingClientRect();
  sparks = sparks.slice(-60);
  [[0.15, 0.15], [0.85, 0.15], [0.5, 0.9]].forEach(([fx_, fy]) => {
    const x = r.left + r.width * fx_, y = r.top + r.height * fy;
    for (let i = 0; i < 22; i++) {
      const ang = Math.random() * Math.PI * 2, sp = 2.5 + Math.random() * 4.5;
      sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 1, c: FIRE[rnd(0, FIRE.length - 1)], s: 3 + Math.random() * 3 });
    }
  });
  if (!fxRun) { fxRun = true; requestAnimationFrame(fxStep); }
}
function fxStep() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  sparks = sparks.filter(p => p.life > 0);
  sparks.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.vx *= 0.97; p.life -= 0.028;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.s * (0.5 + p.life / 2), 0, 7); ctx.fill();
  });
  ctx.globalAlpha = 1;
  if (sparks.length) requestAnimationFrame(fxStep); else { fxRun = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

// ---------- Главный экран ----------
const recordKey = () => `slova_best_${st.klass}_${st.part}`;
function renderHome() {
  $('tabs').innerHTML = [1, 2, 3, 4].map(k =>
    `<button class="tab${k === st.klass ? ' sel' : ''}${SLOVA[k] ? '' : ' soon'}" data-k="${k}"><b>${k}</b>класс</button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { st.klass = +t.dataset.k; store.set('klass', st.klass); renderHome(); });

  if (!SLOVA[st.klass]) {
    $('classBox').innerHTML = `<div class="soonbox"><b>🚧</b>Слова для ${st.klass} класса скоро появятся.<br>А пока потренируйся в 3 классе!</div>`;
    return;
  }
  const k = SLOVA[st.klass];
  const counts = [k.chasti[0].length, k.chasti[1].length, k.chasti.flat().length];
  const best = store.get(recordKey(), 0);
  $('classBox').innerHTML = `
    <div class="label">1. Что повторяем?</div>
    <div class="modes">${PART_NAME.map((n, i) =>
      `<button class="mode${i === st.part ? ' sel' : ''}" data-part="${i}"><b>${['📘', '📗', '📚'][i]}</b>${n}<br><small>${counts[i]} слов</small></button>`).join('')}</div>
    <div class="label">2. Как играем?</div>
    <div class="modes two">
      <button class="mode${st.mode === 'calm' ? ' sel' : ''}" data-mode="calm"><b>🐢</b>Без времени<br><small>10 слов</small></button>
      <button class="mode${st.mode === 'time' ? ' sel' : ''}" data-mode="time"><b>⏱️</b>На время<br><small>1 минута</small>${best ? `<br><span class="rec">🏆 ${best}</span>` : ''}</button>
    </div>
    <button class="big" id="startBtn">▶ Начать</button>
    <button class="big light" id="listBtn">📋 Все слова ${st.klass} класса</button>`;
  document.querySelectorAll('[data-part]').forEach(b => b.onclick = () => { st.part = +b.dataset.part; renderHome(); });
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { st.mode = b.dataset.mode; renderHome(); });
  $('startBtn').onclick = start;
  $('listBtn').onclick = showList;
}
function showList() {
  const k = SLOVA[st.klass];
  openModal(k.chasti.map((ch, i) =>
    `<h3>${['📘', '📗'][i]} ${PART_NAME[i]}</h3><div class="list">${ch.map(parse).map(w => `<div>${w.emoji} ${marked(w)}</div>`).join('')}</div>`).join(''),
    'Закрыть');
}
function updSound() { $('soundBtn').textContent = soundOn ? '🔊 Звук' : '🔇 Без звука'; }
$('soundBtn').onclick = () => { soundOn = !soundOn; store.set('sound', soundOn); updSound(); beep([660]); };

// ---------- Окно ----------
let onModalClose = null;
function openModal(html, btn = 'Понятно', after = null) {
  $('modalText').innerHTML = html; $('modalClose').textContent = btn;
  onModalClose = after; $('modal').classList.add('on');
}
$('modalClose').onclick = () => { $('modal').classList.remove('on'); const f = onModalClose; onModalClose = null; if (f) f(); };

// ---------- Игра ----------
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function show(id) { document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); window.scrollTo(0, 0); }
// Случайное слово, но не то же, что только что было
function randomWord() {
  const all = wordsOf(st.klass, st.part);
  let w, n = 0;
  do { w = all[rnd(0, all.length - 1)]; } while (w.raw === st.last && ++n < 20);
  return w;
}

function start() {
  Object.assign(st, { ok: 0, bad: 0, done: 0, firstTry: 0, missed: [], locked: false, last: '' });
  st.queue = st.mode === 'calm' ? shuffle(wordsOf(st.klass, st.part)).slice(0, ROUND) : [];
  show('game');
  if (st.mode === 'time') {
    st.endAt = Date.now() + TIME * 1000;
    clearInterval(st.tick);
    st.tick = setInterval(timeTick, 100);
    timeTick();
  }
  next();
}

function next() {
  st.locked = false; st.gap = 0;
  st.cur = st.mode === 'calm' ? st.queue.shift() : randomWord();
  if (!st.cur) return finish();
  st.last = st.cur.raw;
  st.cur.fails = st.cur.fails || 0;
  $('card').className = 'card';
  $('pic').textContent = st.cur.emoji;
  drawWord(); drawOpts(); drawTop();
}

function drawWord(wrongLetter) {
  const w = st.cur;
  $('word').classList.toggle('long', w.text.length > 9);
  $('word').innerHTML = w.parts.map(p => {
    if (typeof p === 'string') return p.replace(/ /g, '<br>');
    const g = p.gap;
    if (g < st.gap) return `<span class="gap ok">${w.gaps[g].right}</span>`;
    if (g === st.gap && wrongLetter) return `<span class="gap no">${wrongLetter}</span>`;
    return `<span class="gap${g === st.gap ? ' cur' : ''}">?</span>`;
  }).join('');
}

function drawOpts() {
  const g = st.cur.gaps[st.gap];
  $('opts').innerHTML = '';
  shuffle([...g.opts]).forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt'; b.textContent = o;
    b.addEventListener('pointerdown', e => { e.preventDefault(); choose(o); });
    $('opts').appendChild(b);
  });
}

function drawTop() {
  if (st.mode === 'calm') {
    // Слово, уже учтённое в done или переложенное в очередь, второй раз не считаем
    const total = st.done + st.queue.length + (st.cur && !st.cur.counted ? 1 : 0);
    $('count').textContent = Math.min(st.done + 1, total) + '/' + total;
    $('barFill').style.width = (st.done / total * 100) + '%';
    $('score').innerHTML = `✅ <b>${st.ok}</b> &nbsp; ❌ <span class="x">${st.bad}</span>`;
  } else {
    $('score').innerHTML = `Слов: <b>${st.ok}</b> &nbsp; ❌ <span class="x">${st.bad}</span>`;
  }
}

function timeTick() {
  const left = Math.max(0, st.endAt - Date.now());
  $('count').textContent = '⏱ ' + Math.ceil(left / 1000);
  $('barFill').style.width = (left / (TIME * 1000) * 100) + '%';
  if (left <= 0) { clearInterval(st.tick); finish(); }
}

function choose(letter) {
  if (st.locked || !st.cur) return;
  const w = st.cur, g = w.gaps[st.gap];
  if (letter === g.right) {
    st.gap++;
    if (st.gap < w.gaps.length) { beep([660], 0.06); drawWord(); drawOpts(); return; }
    // Слово собрано целиком
    st.locked = true; st.ok++;
    if (!w.fails) st.firstTry++;
    w.counted = true;
    drawWord();
    $('card').className = 'card ok';
    const p = document.createElement('div'); p.className = 'pop';
    p.textContent = PRAISE[rnd(0, PRAISE.length - 1)]; $('card').appendChild(p);
    setTimeout(() => p.remove(), 900);
    firework();
    beep([660, 880, 1175], 0.08);
    st.done++; drawTop();
    setTimeout(next, 750);
  } else {
    st.locked = true; st.bad++; w.fails++;
    if (!st.missed.some(m => m.raw === w.raw)) st.missed.push(w);
    drawWord(letter); drawTop();
    $('card').className = 'card no';
    buzz();
    // На время: пока ребёнок смотрит запоминалку, таймер стоит
    if (st.mode === 'time') { st.pausedLeft = st.endAt - Date.now(); clearInterval(st.tick); }
    setTimeout(() => showMemo(w, g), 650);
  }
}

// Картинка-запоминалка: смайлик, верная буква, слово целиком и фраза-подсказка
function showMemo(w, g) {
  openModal(`<div class="memo">
      <div class="art"><span class="emo">${w.emoji}</span><span class="lt">${g.right}</span></div>
      <div class="right">${marked(w)}</div>
      <div class="tip">${tip(g.hint)}</div>
    </div>`, 'Запомнил! Дальше', afterMemo);
}
function afterMemo() {
  if (st.mode === 'calm') {
    // Слово с ошибкой повторим в конце круга
    st.queue.push({ ...st.cur, counted: false });
    st.cur.counted = true;
  } else {
    st.endAt = Date.now() + st.pausedLeft;
    st.tick = setInterval(timeTick, 100);
  }
  drawTop();
  next();
}

function finish() {
  clearInterval(st.tick);
  st.cur = null; st.locked = true;
  let stars, num, txt, mini;
  $('newRec').hidden = true;
  const where = `${st.klass} класс · ${PART_NAME[st.part].toLowerCase()}`;
  if (st.mode === 'calm') {
    const total = st.done;
    num = st.firstTry + '/' + total;
    stars = st.firstTry === total ? 3 : st.firstTry >= total * 0.7 ? 2 : 1;
    txt = st.firstTry === total ? 'Без единой ошибки! Ты супер!' : stars === 2 ? 'Отлично! Почти без ошибок!' : 'Молодец! Ещё разок, и будет лучше!';
    mini = `${where} · сразу верно ${st.firstTry} из ${total}`;
  } else {
    num = st.ok;
    stars = st.ok >= 20 ? 3 : st.ok >= 12 ? 2 : 1;
    txt = 'слов за 1 минуту!';
    const best = store.get(recordKey(), 0);
    if (st.ok > best) { store.set(recordKey(), st.ok); if (st.ok > 0) $('newRec').hidden = false; }
    mini = `${where} · ошибок: ${st.bad} · рекорд: ${Math.max(best, st.ok)}`;
  }
  $('stars').innerHTML = [1, 2, 3].map(i => `<span class="${i <= stars ? '' : 'off'}">⭐</span>`).join('');
  $('resNum').textContent = num; $('resTxt').textContent = txt; $('resMini').textContent = mini;
  $('mist').hidden = !st.missed.length;
  $('mist').innerHTML = `<div>Повтори эти слова:</div>${st.missed.map(w => `${w.emoji} ${marked(w)}`).join('<br>')}`;
  show('result');
  beep([523, 659, 784, 1047], 0.13);
}

function goHome() { clearInterval(st.tick); st.cur = null; $('modal').classList.remove('on'); onModalClose = null; renderHome(); show('home'); }
$('backBtn').onclick = goHome;
$('homeBtn').onclick = goHome;
$('againBtn').onclick = start;

// ---------- Установка на телефон ----------
let deferredPrompt = null;
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
if (standalone) $('installBtn').hidden = true;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
$('installBtn').onclick = async () => {
  if (deferredPrompt) { deferredPrompt.prompt(); await deferredPrompt.userChoice; deferredPrompt = null; return; }
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  openModal('<h3>📲 Как поставить на телефон</h3>' + (ios
    ? '<ol><li>Откройте эту страницу в <b>Safari</b>.</li><li>Нажмите кнопку <b>«Поделиться»</b> (квадрат со стрелкой вверх).</li><li>Выберите <b>«На экран Домой»</b>.</li></ol>Иконка «Словарик» появится на экране телефона.'
    : '<ol><li>Откройте эту страницу в <b>Chrome</b>.</li><li>Нажмите <b>⋮</b> (три точки вверху справа).</li><li>Выберите <b>«Установить приложение»</b> или <b>«Добавить на главный экран»</b>.</li></ol>Иконка «Словарик» появится на экране телефона.'));
};

st.klass = store.get('klass', 3);
updSound(); renderHome();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
